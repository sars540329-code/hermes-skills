<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 戰情室</title>
<style>
:root{--bg:#070b16;--panel:#0d1426;--panel2:#111a31;--line:#1f2b48;--text:#e6ecf8;--dim:#8b98b8;--acc:#22d3ee;--acc2:#a78bfa;--warn:#fbbf24;--bad:#f87171;--ok:#34d399}
:root[data-theme="violet"]{--bg:#0b0816;--panel:#150f26;--panel2:#1b1431;--line:#2e2348;--acc:#c084fc;--acc2:#22d3ee}
:root[data-theme="ink"]{--bg:#0a0a0c;--panel:#131316;--panel2:#18181c;--line:#2a2a30;--acc:#e5e7eb;--acc2:#fbbf24}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 "Microsoft JhengHei","PingFang TC",system-ui,sans-serif}
#rain{position:fixed;inset:0;opacity:.12;pointer-events:none;z-index:0}
main{position:relative;z-index:1;max-width:1400px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;margin-bottom:18px}
h1{margin:0;font-size:clamp(22px,3vw,30px);letter-spacing:.04em}
h1 em{font-style:normal;color:var(--acc)}
.env{display:flex;gap:8px;flex-wrap:wrap;font-size:14px}
.pill{padding:3px 10px;border:1px solid var(--line);border-radius:99px;color:var(--dim)}
.pill.opt{opacity:.75}
.pill.ok{color:var(--ok);border-color:#1f5a47}.pill.bad{color:var(--bad);border-color:#6b2a2a}
.sp{flex:1}
select,input,textarea,button{font:inherit;color:var(--text)}
select,input[type=text],textarea{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
textarea{resize:vertical}
button{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;min-height:44px}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);color:#04111a;border-color:var(--acc);font-weight:700}
button.danger{color:var(--bad)}
button:disabled{opacity:.5;cursor:not-allowed}
h2{font-size:20px;margin:26px 0 12px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
h2 small{flex:1 1 220px}
h2 small{color:var(--dim);font-size:14px;font-weight:400}
#seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.seat{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--c,var(--acc));border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:9px}
.seat.off{opacity:.45}
.row{display:flex;gap:8px;align-items:center}
.row>*{min-width:0}
.lbl{font-size:14px;color:var(--dim);margin-bottom:-4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:14px;padding:2px 9px;border-radius:99px;background:var(--panel2);border:1px solid var(--line)}
.chip.warn{color:var(--warn);border-color:#6b5520}
.small{font-size:14px;min-height:44px;padding:6px 12px}
.add{display:flex;align-items:center;justify-content:center;border:2px dashed var(--line);border-radius:14px;min-height:200px;color:var(--dim);cursor:pointer;background:none}
.add:hover{color:var(--acc);border-color:var(--acc)}
.tog{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--dim);cursor:pointer}
#room{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
#log{margin-top:14px;display:flex;flex-direction:column;gap:12px}
.msg{border-left:3px solid var(--c,var(--acc));background:var(--panel2);border-radius:0 12px 12px 0;padding:10px 14px}
.msg .who{font-weight:700;color:var(--c,var(--acc))}
.msg .who small{color:var(--dim);font-weight:400;margin-left:6px}
.msg .body{white-space:pre-wrap;margin-top:6px}
.msg .body h3{margin:8px 0 2px;font-size:17px;color:var(--acc)}
.tool{font-size:14px;color:var(--dim);font-family:Consolas,monospace}
.msg .body,.tool,#attach,.crumb,.chip{overflow-wrap:anywhere}
.x{border:0;background:none;min-height:44px;min-width:44px;padding:0 6px;color:var(--dim);cursor:pointer}
footer{margin-top:28px;color:var(--dim);font-size:14px;text-align:center}
.err{color:var(--bad);font-size:14px}
.note{color:var(--dim);font-size:14px}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:16px;width:min(640px,94vw);max-height:84vh}
dialog::backdrop{background:#000a}
.list{max-height:52vh;overflow:auto;border:1px solid var(--line);border-radius:10px;margin:10px 0}
.item{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.item:hover{background:var(--panel2)}
.item .d{font-size:14px;color:var(--dim)}
.crumb{font-size:14px;color:var(--dim);word-break:break-all}
.themes{display:flex;gap:6px}
.themes button{width:44px;height:44px;min-height:44px;padding:0;border-radius:50%;border:3px solid var(--bg)}
.cursor::after{content:"▌";color:var(--acc);animation:b 1s steps(1) infinite}
@keyframes b{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){#rain{display:none}.cursor::after{animation:none}}
@media (max-width:600px){body{font-size:17px}}
</style>
</head>
<body>
<canvas id="rain"></canvas>
<main>
<header>
  <h1>AI <em>戰情室</em></h1>
  <div class="env" id="env"></div>
  <div class="sp"></div>
  <label class="row" style="gap:6px;width:auto">模型 <select id="model" style="width:auto"></select></label>
  <div class="themes" title="切換色系">
    <button data-t="" style="background:#22d3ee"></button>
    <button data-t="violet" style="background:#c084fc"></button>
    <button data-t="ink" style="background:#e5e7eb"></button>
  </div>
</header>

<h2>隊員 <small>每一位是一條獨立的 Claude 對話。改完會自動存。</small></h2>
<div id="seats"></div>

<h2>討論室 <small>丟一個題目，席位依序發言，最後整理成會議紀錄。</small></h2>
<section id="room">
  <textarea id="topic" rows="3" placeholder="例如：最近 AI 伺服器相關的新聞很多，這個題材接下來值得留意的是什麼？"></textarea>
  <div class="row" style="margin-top:10px;flex-wrap:wrap">
    <button id="attachBtn">📎 附一個檔案</button>
    <span id="attach" class="note"></span>
    <div class="sp"></div>
    <button id="stop" class="danger" disabled>停止</button>
    <button id="go" class="pri">開始討論</button>
  </div>
  <div id="log"></div>
</section>
<footer id="disc"></footer>
</main>

<dialog id="dlg">
  <div class="row"><strong id="dlgTitle"></strong><div class="sp"></div><button class="small" id="dlgClose">關閉</button></div>
  <div id="dlgBody"></div>
</dialog>

<script>
const TOKEN = '__WARROOM_TOKEN__';
const H = {'Content-Type': 'application/json', 'X-Warroom-Token': TOKEN};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const COLORS = ['#38bdf8','#a78bfa','#f472b6','#34d399','#fbbf24','#fb923c','#f87171','#22d3ee'];
let S = {seats: [], skills: [], env: {}, models: {}};
let attach = '';

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {headers: H} : {method: 'POST', headers: H, body: JSON.stringify(body)});
  const j = await r.json().catch(() => ({error: '連線失敗（代碼 ' + r.status + '），戰情室程式還開著嗎？'}));
  if (!r.ok || j.error) { const e = new Error(j.error || ('連線失敗（代碼 ' + r.status + '）')); e.busy = j.busy; throw e; }
  return j;
}
let saveT;
function saveNow() { clearTimeout(saveT); return api('/api/seats', {seats: S.seats}).then(() => true).catch(e => { alert('存檔失敗：' + e.message); return false; }); }
function save() { clearTimeout(saveT); saveT = setTimeout(saveNow, 400); }

async function load() {
  S = await api('/api/state');
  const e = S.env;
  $('#env').innerHTML = `<span class="pill ${e.sdk ? 'ok' : 'bad'}">${e.sdk ? '✓' : '✗'} Claude SDK</span>`
    + (e.api_key ? '<span class="pill bad">✗ 偵測到 API key（會改走付費）</span>' : '')
    + [['Python', e.python], ['Git', e.git], ['Node', e.node]].map(([n, ok]) => `<span class="pill opt ${ok ? 'ok' : ''}" title="選配：勾「可以執行程式」時才會用到">${ok ? '✓' : '—'} ${n}</span>`).join('')
    + `<span class="pill">${S.skills.length} 個 Skill</span>`;
  $('#disc').textContent = S.disclaimer || '';
  if (S.busy) { $('#stop').disabled = false; $('#log').innerHTML = '<div class="note">上一場討論還在跑（可能是另一個分頁開的）。要重來先按「停止」。</div>'; }
  $('#model').innerHTML = Object.entries(S.models).map(([k, v]) => `<option value="${k}">${v}</option>`).join('');
  try { $('#model').value = localStorage.getItem('wr-model') || 'sonnet'; } catch (_) {}
  render();
}

function skillInfo(id) { return S.skills.find(s => s.id === id) || {id, name: id, needs: [], missing: true}; }
function lacks(sk) { return (sk.needs || []).filter(n => !S.env[n]); }

function render() {
  const box = $('#seats');
  box.innerHTML = S.seats.map((s, i) => {
    const skills = (s.skills || []).map(id => {
      const sk = skillInfo(id), miss = lacks(sk);
      return `<span class="chip ${miss.length || sk.missing ? 'warn' : ''}" title="${esc(sk.desc || '')}">${esc(sk.name)}${sk.missing ? '（找不到）' : miss.length ? '（缺 ' + miss.join('、') + '）' : ''}</span>`;
    }).join('') || '<span class="note">沒有勾 Skill</span>';
    const kb = (s.kb || []).map((d, j) => `<span class="chip" title="${esc(d)}">📁 ${esc(d.split(/[\\/]/).filter(Boolean).pop())} <button class="x" data-rmkb="${i},${j}" title="移除">✕</button></span>`).join('') || '<span class="note">沒有指定知識庫</span>';
    return `<div class="seat ${s.off ? 'off' : ''}" style="--c:${esc(s.color || COLORS[i % COLORS.length])}">
      <div class="row"><input type="text" value="${esc(s.name)}" data-f="name" data-i="${i}" placeholder="名字" style="flex:0 0 96px">
        <input type="text" value="${esc(s.occupation)}" data-f="occupation" data-i="${i}" placeholder="職業"></div>
      <div class="row"><span class="lbl" style="margin:0;flex:0 0 auto">模型</span>
        <select data-f="model" data-i="${i}"><option value="">跟預設（頁首）</option>${Object.entries(S.models).map(([k, v]) => `<option value="${k}" ${s.model === k ? 'selected' : ''}>${esc(v)}</option>`).join('')}</select></div>
      <div class="lbl">性格與說話方式</div>
      <textarea rows="3" data-f="personality" data-i="${i}">${esc(s.personality)}</textarea>
      <div class="row"><button class="small" data-gen="${i}">✨ 讓 AI 生職業與性格</button></div>
      <div class="lbl">Skill</div><div class="chips">${skills}</div>
      <div class="row"><button class="small" data-sk="${i}">選 Skill</button></div>
      <div class="lbl">知識庫</div><div class="chips">${kb}</div>
      <div class="row"><button class="small" data-kb="${i}">📁 選資料夾</button></div>
      <div class="row" style="flex-wrap:wrap;gap:14px">
        <label class="tog"><input type="checkbox" data-exec="${i}" ${s.exec ? 'checked' : ''}> 可以執行程式</label>
        <label class="tog"><input type="checkbox" data-on="${i}" ${s.off ? '' : 'checked'}> 參加討論</label>
        <div class="sp"></div><button class="small danger" data-del="${i}">刪除</button>
      </div>
      ${s.exec ? '<div class="err">⚠ 開啟後，這位 AI 可以在你的電腦上執行指令，也能修改或刪除檔案。只在你信任題目與知識庫內容時打開。</div>' : ''}
      ${s.exec && !S.env.git ? '<div class="err">這台電腦沒有 Git for Windows：執行程式這個功能在 Windows 上需要它。</div>' : ''}
      ${s.exec && !S.env.python ? '<div class="err">這台電腦找不到 Python：需要 Python 的程式會跑不起來，AI 會改用讀資料的方式回答。</div>' : ''}
    </div>`;
  }).join('') + '<button class="add" id="addSeat">＋ 加一位</button>';
}

$('#seats').addEventListener('input', e => {
  const t = e.target, i = t.dataset.i;
  if (i !== undefined && t.dataset.f) { S.seats[i][t.dataset.f] = t.value; save(); }
});
$('#seats').addEventListener('change', e => {
  const t = e.target;
  if (t.tagName === 'SELECT' && t.dataset.f) { S.seats[t.dataset.i][t.dataset.f] = t.value; save(); return; }
  if (t.dataset.exec !== undefined) { S.seats[t.dataset.exec].exec = t.checked; save(); render(); }
  if (t.dataset.on !== undefined) { S.seats[t.dataset.on].off = !t.checked; save(); render(); }
});
$('#seats').addEventListener('click', async e => {
  const t = e.target.closest('[data-gen],[data-sk],[data-kb],[data-del],[data-rmkb],#addSeat');
  if (!t) return;
  e.preventDefault();
  if (t.id === 'addSeat') {
    const i = S.seats.length;
    S.seats.push({id: [...crypto.getRandomValues(new Uint8Array(4))].map(b => b.toString(16).padStart(2, '0')).join(''), name: '新星', occupation: '', personality: '', skills: [], kb: [], exec: false, model: '', color: COLORS[i % COLORS.length]});
    save(); render(); return;
  }
  if (t.dataset.del !== undefined) {
    if (confirm('刪除「' + S.seats[t.dataset.del].name + '」？')) { S.seats.splice(t.dataset.del, 1); save(); render(); }
    return;
  }
  if (t.dataset.rmkb) { const [i, j] = t.dataset.rmkb.split(',').map(Number); S.seats[i].kb.splice(j, 1); save(); render(); return; }
  if (t.dataset.gen !== undefined) {
    const i = +t.dataset.gen, s = S.seats[i];
    const hint = prompt('想要什麼樣的隊員？（例如：看籌碼的、會唱反調的、懂總經的）\n留空＝讓 AI 自己挑一個團隊缺的角色', s.occupation || '');
    if (hint === null) return;
    t.disabled = true; t.textContent = '生成中…';
    try {
      const g = await api('/api/generate', {hint, model: $('#model').value, taken: S.seats.filter((_, j) => j !== i).map(x => x.name).join('、')});
      Object.assign(s, {name: g.name || s.name, occupation: g.occupation || s.occupation, personality: g.personality || s.personality});
      save();
    } catch (err) { alert('生成失敗：' + err.message); }
    render(); return;
  }
  if (t.dataset.sk !== undefined) return pickSkills(+t.dataset.sk);
  if (t.dataset.kb !== undefined) return pickFolder('選這位的知識庫資料夾', false, p => {
    const s = S.seats[+t.dataset.kb]; s.kb = s.kb || [];
    if (!s.kb.includes(p)) s.kb.push(p); save(); render();
  });
});

/* ---------- 對話框：選 Skill ---------- */
function openDlg(title, html) { $('#dlgTitle').textContent = title; $('#dlgBody').innerHTML = html; $('#dlg').showModal(); }
$('#dlgClose').onclick = () => $('#dlg').close();
function pickSkills(i) {
  const s = S.seats[i], sel = new Set(s.skills || []);
  if (!S.skills.length) return openDlg('選 Skill', `<p class="note">在 ${esc(S.env.skill_dir)} 裡沒有找到任何 Skill。</p>`);
  openDlg('選「' + s.name + '」可以用的 Skill', `<input type="text" id="skq" placeholder="搜尋…">
    <div class="list">${S.skills.map(k => {
      const miss = lacks(k);
      return `<label class="item" data-name="${esc((k.name + ' ' + k.desc).toLowerCase())}"><input type="checkbox" value="${esc(k.id)}" ${sel.has(k.id) ? 'checked' : ''}>
      <div><div>${esc(k.name)} ${miss.length ? `<span class="chip warn">這台電腦缺 ${miss.join('、')}</span>` : ''}</div><div class="d">${esc(k.desc)}</div></div></label>`;
    }).join('')}</div><div class="row"><div class="sp"></div><button class="pri" id="skOk">確定</button></div>`);
  $('#skq').oninput = e => { const q = e.target.value.toLowerCase(); document.querySelectorAll('#dlgBody .item').forEach(el => el.style.display = el.dataset.name.includes(q) ? '' : 'none'); };
  $('#skOk').onclick = () => { s.skills = [...document.querySelectorAll('#dlgBody input[type=checkbox]:checked')].map(x => x.value); save(); render(); $('#dlg').close(); };
}

/* ---------- 對話框：選資料夾／檔案（伺服器端瀏覽，拿得到完整路徑） ---------- */
function pickFolder(title, wantFile, done) {
  async function go(path) {
    let r;
    try { r = await api('/api/browse?path=' + encodeURIComponent(path || '')); }
    catch (e) { return openDlg(title, `<p class="err">${esc(e.message)}</p>`); }
    openDlg(title, `<div class="crumb">${esc(r.path || '選一個起點')}</div>
      <div class="list">
        ${r.path ? `<div class="item" data-go="${esc(r.parent)}">⬆ 上一層</div>` : ''}
        ${r.dirs.map(d => `<div class="item" data-go="${esc(d.path)}">📁 ${esc(d.name)}</div>`).join('')}
        ${wantFile ? r.files.map(f => `<div class="item" data-file="${esc(f.path)}">📄 ${esc(f.name)}</div>`).join('') : ''}
        ${!r.dirs.length && !(wantFile && r.files.length) ? '<div class="item note">（空的）</div>' : ''}
      </div>
      <div class="row">${r.path && !wantFile ? `<span class="note">Obsidian 通常選整個 vault 資料夾</span><div class="sp"></div><button class="pri" id="pickHere">選這個資料夾</button>` : `<span class="note">${wantFile ? '點一個檔案就選定' : ''}</span>`}</div>`);
    document.querySelectorAll('#dlgBody [data-go]').forEach(el => el.onclick = () => go(el.dataset.go));
    document.querySelectorAll('#dlgBody [data-file]').forEach(el => el.onclick = () => { $('#dlg').close(); done(el.dataset.file); });
    const b = $('#pickHere'); if (b) b.onclick = () => { $('#dlg').close(); done(r.path); };
  }
  go('');
}
$('#attachBtn').onclick = () => pickFolder('附一個檔案給大家看', true, p => { attach = p; $('#attach').innerHTML = '📄 ' + esc(p) + ' <a href="#" id="unatt">✕</a>'; $('#unatt').onclick = e => { e.preventDefault(); attach = ''; $('#attach').textContent = ''; }; });

/* ---------- 討論 ---------- */
function mdLite(s) {
  return esc(s).replace(/^#{2,3} (.+)$/gm, '<h3>$1</h3>').replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
}
$('#go').onclick = async () => {
  const topic = $('#topic').value.trim();
  if (!topic) return alert('先寫一個題目');
  if (!S.seats.some(s => !s.off)) return alert('至少要有一位參加討論');
  if (!(await saveNow())) return;
  $('#go').disabled = true; $('#stop').disabled = false;
  const log = $('#log'); log.innerHTML = '';
  let cur = null, curText = '';
  const t0 = Date.now();
  try {
    const r = await fetch('/api/discuss', {method: 'POST', headers: H, body: JSON.stringify({topic, attach, model: $('#model').value})});
    if (!r.ok) {
      const j = await r.json().catch(() => ({}));
      if (j.busy) { $('#go').disabled = false; $('#stop').disabled = false; log.innerHTML = `<div class="err">⚠ ${esc(j.error)}</div>`; return; }
      throw new Error(j.error || '連線失敗（代碼 ' + r.status + '）');
    }
    const rd = r.body.getReader(), dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const {value, done} = await rd.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      let k;
      while ((k = buf.indexOf('\n\n')) >= 0) {
        const line = buf.slice(0, k); buf = buf.slice(k + 2);
        if (!line.startsWith('data: ')) continue;
        let ev; try { ev = JSON.parse(line.slice(6)); } catch (_) { continue; }
        if (ev.t === 'seat') {
          cur = document.createElement('div'); cur.className = 'msg'; cur.style.setProperty('--c', ev.color || 'var(--acc)');
          cur.innerHTML = `<div class="who">${esc(ev.name)}<small>${esc(ev.occupation)}</small>${ev.model ? `<small>${esc(ev.model)}</small>` : ''}</div><div class="tools"></div><div class="body cursor"></div>`;
          log.appendChild(cur); curText = '';
          cur.scrollIntoView({block: 'nearest', behavior: 'smooth'});
        } else if (ev.t === 'delta' && cur) {
          curText += ev.text; cur.querySelector('.body').innerHTML = mdLite(curText);
        } else if (ev.t === 'tool' && cur) {
          const d = document.createElement('div'); d.className = 'tool';
          d.textContent = '⚙ ' + ev.name + (ev.brief ? '：' + ev.brief : '');
          cur.querySelector('.tools').appendChild(d);
        } else if (ev.t === 'seat_end' && cur) {
          cur.querySelector('.body').classList.remove('cursor');
          if (ev.secs) cur.querySelector('.who').insertAdjacentHTML('beforeend', `<small>${ev.secs} 秒</small>`);
        } else if (ev.t === 'warn') {
          const d = document.createElement('div'); d.className = 'note'; d.textContent = '⚠ ' + ev.msg; (cur || log).appendChild(d);
        } else if (ev.t === 'error') {
          const d = document.createElement('div'); d.className = 'err'; d.textContent = '⚠ ' + ev.msg; (cur || log).appendChild(d);
        } else if (ev.t === 'done') {
          const d = document.createElement('div'); d.className = 'note';
          d.textContent = (ev.stopped ? '已停止' : '討論結束') + `，共 ${Math.round((Date.now() - t0) / 1000)} 秒` + (ev.log ? `｜紀錄存在 ${ev.log}` : '');
          log.appendChild(d);
        }
      }
    }
  } catch (e) {
    log.insertAdjacentHTML('beforeend', `<div class="err">⚠ ${esc(e.message)}</div>`);
  }
  document.querySelectorAll('.cursor').forEach(el => el.classList.remove('cursor'));
  $('#go').disabled = false; $('#stop').disabled = true;
};
$('#stop').onclick = () => { api('/api/stop', {}).catch(() => {}); $('#stop').disabled = true; };
$('#model').onchange = e => { try { localStorage.setItem('wr-model', e.target.value); } catch (_) {} };

/* ---------- 色系 ---------- */
function setTheme(t) { if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; try { localStorage.setItem('wr-theme', t); } catch (_) {} }
document.querySelectorAll('.themes button').forEach(b => b.onclick = () => setTheme(b.dataset.t));
try { setTheme(localStorage.getItem('wr-theme') || ''); } catch (_) {}

/* ---------- 背景數據流 ---------- */
(function () {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = $('#rain'), x = c.getContext('2d'); let cols, drops;
  function size() { c.width = innerWidth; c.height = innerHeight; cols = Math.floor(c.width / 16); drops = Array(cols).fill(0).map(() => Math.random() * c.height / 16); }
  size(); addEventListener('resize', size);
  setInterval(() => {
    x.fillStyle = 'rgba(0,0,0,.08)'; x.fillRect(0, 0, c.width, c.height);
    x.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--acc'); x.font = '14px monospace';
    drops.forEach((y, i) => { x.fillText(String.fromCharCode(0x30A0 + Math.random() * 96), i * 16, y * 16); drops[i] = y * 16 > c.height && Math.random() > .975 ? 0 : y + 1; });
  }, 70);
})();

load().catch(e => document.body.insertAdjacentHTML('afterbegin', `<p class="err">載入失敗：${esc(e.message)}</p>`));
</script>
</body>
</html>
